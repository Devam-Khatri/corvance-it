<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | CORVANCE Private Limited</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="assets/logo-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf7f1;--gold:#a9791f;--gold-light:#d9b35c;--text:#1b1c20;--muted:#666a72;--line:#e8e2d3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(1000px 480px at 88% -6%,#f6ecd6,transparent 62%),var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:22px 26px}
  header img{height:36px;width:auto}
  header span{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.22rem}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 22px}
  .card{max-width:520px}
  .code{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:5rem;line-height:1;color:var(--gold)}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.6rem,4.5vw,2.2rem);margin:14px 0 14px;line-height:1.25}
  p{color:var(--muted);font-size:1.05rem;line-height:1.6}
  .btn{display:inline-flex;margin-top:26px;padding:14px 26px;border-radius:10px;font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1b1400;text-decoration:none}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <img src="assets/logo-icon.jpg" alt="">
  <span>CORVANCE</span>
</header>
<main>
  <div class="card">
    <div class="code">404</div>
    <h1>This page could not be found.</h1>
    <p>The page you were looking for may have been moved, renamed, or the address may have been typed incorrectly.</p>
    <a class="btn" href="/">Return to homepage</a>
  </div>
</main>
<footer>&copy; <span id="yr"></span> CORVANCE PRIVATE LIMITED. All rights reserved.</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
